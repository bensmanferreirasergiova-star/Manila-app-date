<style>
:root {
  --ink: #111113;
  --muted: #6e6a72;
  --line: #ede8ee;
  --accent: #ef5366;
  --accent-soft: #fff0f2;
  --green: #10b981;
  --green-soft: #ecfdf5;
  --green-border: #a7f3d0;
  --green-text: #065f46;
  --bg: #ffffff;
  --card-bg: #faf8fa;
  --pill-bg: #f4f0f4;
  --pill-color: #635e67;
  --date-note-bg: #fbf7fb;
  --date-note-color: #1f1b24;
  --input-bg: #ffffff;
  --input-border: #ded8df;
  --primary-bg: #111113;
  --primary-color: #ffffff;
  --secondary-bg: #f7f4f7;
  --secondary-color: #111113;
  --shadow-color: rgba(0,0,0,0.12);
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --max: 520px;
}

[data-theme="dark"] {
  --ink: #f8f6fb;
  --muted: #a49cb0;
  --line: #262232;
  --accent: #ff5c73;
  --accent-soft: #2e161c;
  --green: #10b981;
  --green-soft: #08291e;
  --green-border: #135d46;
  --green-text: #6ee7b7;
  --bg: #0d0c12;
  --card-bg: #181622;
  --pill-bg: #211d2c;
  --pill-color: #c9c1d6;
  --date-note-bg: #1a1725;
  --date-note-color: #f0ecf7;
  --input-bg: #181622;
  --input-border: #322d3f;
  --primary-bg: #f8f6fb;
  --primary-color: #0e0d13;
  --secondary-bg: #221e2e;
  --secondary-color: #f8f6fb;
  --shadow-color: rgba(0,0,0,0.5);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none !important;
}
html, body {
  min-height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-x: none;
  -webkit-tap-highlight-color: transparent !important;
  transition: background-color 0.25s ease, color 0.25s ease;
}

img, button, a, .profile-gallery, .match-card, .reveal-card, .option {
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  user-select: none !important;
  outline: none !important;
}

button, input { font: inherit; }
a { color: inherit; text-decoration: none; }

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.site-header {
  width: 100%;
  max-width: var(--max);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
}

.brand {
  font-weight: 900;
  font-size: 22px;
  letter-spacing: -0.04em;
  color: var(--ink);
}
.brand span { color: var(--accent); }

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.theme-toggle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card-bg);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 2px 8px var(--shadow-color);
  transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
.theme-toggle:hover {
  transform: scale(1.1);
  border-color: var(--accent);
}
.theme-toggle:active {
  transform: scale(0.92);
}

.header-pill {
  font-size: 12px;
  font-weight: 750;
  color: var(--pill-color);
  background: var(--pill-bg);
  border-radius: 999px;
  padding: 6px 12px;
}

#screen {
  width: 100%;
  max-width: var(--max);
  margin: 0 auto;
  padding: 8px 20px 40px;
  flex: 1;
}

/* HERO */
.hero { padding: 10px 0 20px; }
.hero-photo {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: 26px;
  display: block;
  box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}
.eyebrow {
  margin-top: 20px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
h1 {
  font-size: clamp(34px, 8.5vw, 44px);
  line-height: 1.05;
  letter-spacing: -0.045em;
  margin: 8px 0 14px;
}
h2 {
  font-size: 28px;
  line-height: 1.12;
  letter-spacing: -0.035em;
  margin: 10px 0 8px;
}
p.sub {
  color: var(--muted);
  font-size: 16px;
  line-height: 1.45;
  margin-bottom: 22px;
}
.hero-copy {
  font-size: 16px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 22px;
}

/* BUTTONS */
.hero-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}
.primary {
  width: 100%;
  min-height: 58px;
  border: 0;
  border-radius: 18px;
  background: var(--primary-bg);
  color: var(--primary-color);
  font-weight: 800;
  font-size: 17px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 24px var(--shadow-color);
  transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
}
.primary:active { transform: scale(0.985); opacity: 0.92; }

.secondary {
  width: 100%;
  min-height: 52px;
  border: 0;
  border-radius: 16px;
  background: var(--secondary-bg);
  color: var(--secondary-color);
  font-weight: 750;
  font-size: 15px;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}
.free-note {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin-top: 12px;
}

/* PROGRESS */
.progress {
  height: 4px;
  background: var(--line);
  border-radius: 99px;
  margin: 8px 0 24px;
  overflow: hidden;
}
.progress i {
  display: block;
  height: 100%;
  background: var(--accent);
  transition: width 0.35s ease;
}

/* QUESTIONS & OPTIONS */
.question { padding: 4px 0; }
.options { display: grid; gap: 10px; margin-top: 14px; }
.option {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px;
  background: var(--card-bg);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 18px;
  text-align: left;
  font-weight: 750;
  font-size: 16px;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.option .label { display: flex; align-items: center; }
.option .emoji { font-size: 22px; margin-right: 12px; }
.option .chevron { color: var(--muted); font-size: 20px; font-weight: 400; }
.option:hover, .option:active {
  background: var(--accent-soft);
  border-color: var(--accent);
  transform: scale(0.99);
}

.input-wrap { display: grid; gap: 14px; margin-top: 16px; }
.input {
  width: 100%;
  min-height: 58px;
  border: 1.5px solid var(--input-border);
  border-radius: 18px;
  padding: 0 18px;
  font-size: 17px;
  background: var(--input-bg);
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}

/* ROULETTE MATCHING */
.matching { text-align: center; padding: 24px 0 10px; }
.matching .status {
  min-height: 38px;
  color: var(--ink);
  font-size: 17px;
  font-weight: 750;
  margin-top: 16px;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.matching .status.fade-out {
  opacity: 0;
  transform: translateY(4px);
}
.carousel-window {
  position: relative;
  overflow: hidden;
  margin: 22px -20px 0;
  padding: 12px 0 18px;
}
.carousel-track {
  display: flex;
  gap: 12px;
  will-change: transform;
}
.match-card {
  flex: 0 0 160px;
  aspect-ratio: 4/5;
  border-radius: 22px;
  overflow: hidden;
  position: relative;
  background: #eee;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.match-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(14px);
  transform: scale(1.06);
}
.match-card.selected {
  transform: scale(1.08);
  box-shadow: 0 14px 36px rgba(239,83,102,0.3);
  outline: 3px solid var(--accent);
}
.selection-line {
  position: absolute;
  left: 50%;
  top: 4px;
  bottom: 6px;
  width: 2px;
  background: var(--accent);
  opacity: 0.85;
  transform: translateX(-50%);
  z-index: 4;
}

/* REVEAL */
.reveal-wrap { text-align: center; padding-top: 10px; }
.reveal-card {
  position: relative;
  cursor: pointer;
  border-radius: 26px;
  overflow: hidden;
  box-shadow: 0 14px 38px rgba(0,0,0,0.14);
  margin: 14px 0 18px;
}
.reveal-card img {
  width: 100%;
  aspect-ratio: 4/5;
  object-fit: cover;
  border-radius: 26px;
  filter: blur(18px);
  transform: scale(1.04);
  transition: filter 0.65s cubic-bezier(0.16,1,0.3,1), transform 0.4s ease;
  display: block;
}
.reveal-card.revealed img {
  filter: blur(0px);
  transform: scale(1);
}
.reveal-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.15);
  transition: opacity 0.4s ease;
}
.reveal-button {
  background: #fff;
  color: var(--ink);
  font-weight: 850;
  font-size: 16px;
  border-radius: 999px;
  padding: 14px 24px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.25);
}
.reveal-card.revealed .reveal-overlay { display: none; }

/* PROFILE VIEW */
.profile { text-align: center; padding: 4px 0 20px; }
.profile-gallery {
  position: relative;
  border-radius: 26px;
  overflow: hidden;
  box-shadow: 0 14px 36px rgba(0,0,0,0.12);
  cursor: pointer;
}
.profile-gallery img {
  width: 100%;
  aspect-ratio: 4/5;
  object-fit: cover;
  border-radius: 26px;
  display: block;
  transition: opacity 0.25s ease;
}
.gallery-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%) scale(1);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  box-shadow: 0 6px 22px rgba(0,0,0,0.18);
  color: var(--ink);
  cursor: pointer;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
.gallery-arrow svg {
  width: 24px;
  height: 24px;
  display: block;
  pointer-events: none;
  stroke: #17151a;
  transition: stroke 0.2s ease;
}
.gallery-arrow.prev { left: 14px; }
.gallery-arrow.next { right: 14px; }

/* EFECTO LUPA / ZOOM EN HOVER */
.gallery-arrow:hover {
  transform: translateY(-50%) scale(1.22);
  background: #ffffff;
  box-shadow: 0 10px 28px rgba(239,83,102,0.35);
  border-color: #ffccd3;
}
.gallery-arrow:hover svg {
  stroke: var(--accent);
}
.gallery-arrow:active {
  transform: translateY(-50%) scale(0.92);
}

.profile-name {
  font-size: 36px;
  font-weight: 850;
  letter-spacing: -0.035em;
  color: var(--ink);
  margin: 18px 0 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 8px;
}
.verified-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  filter: drop-shadow(0 2px 6px rgba(0, 149, 246, 0.45));
}
.profile-meta {
  color: #524c58;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  width: 100%;
  margin: 0 auto 16px;
  padding: 0;
  gap: 6px;
}
.date-note {
  margin: 14px 0 16px;
  font-size: 18px;
  font-weight: 750;
  color: #1f1b24;
  background: #fbf7fb;
  border: 1.5px solid var(--line);
  padding: 16px 20px;
  border-radius: 18px;
  line-height: 1.4;
}

/* GREEN RECIPROCITY BADGE */
.match-badge-green {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--green-soft);
  border: 1.5px solid var(--green-border);
  color: var(--green-text);
  font-weight: 750;
  font-size: 16px;
  padding: 16px 20px;
  border-radius: 18px;
  margin-bottom: 16px;
  line-height: 1.4;
  transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}
.match-badge-green.highlight {
  background: #d1fae5;
  box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.25);
  transform: scale(1.02);
}

.instagram-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
  color: #fff;
  font-weight: 850;
  font-size: 18px;
  padding: 18px 22px;
  border-radius: 18px;
  background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045);
  box-shadow: 0 12px 30px rgba(253,29,29,0.25);
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.instagram-btn:active { transform: scale(0.985); opacity: 0.94; }

/* WAIT / DISQUALIFIED */
.wait {
  text-align: center;
  padding: 60px 10px;
}
.wait-icon { font-size: 44px; margin-bottom: 14px; }
.wait h2 { font-size: 30px; }
.wait p { font-size: 16px; color: var(--muted); line-height: 1.55; margin: 12px 0 26px; }

/* FOOTER */
.site-footer {
  max-width: var(--max);
  width: 100%;
  margin: 0 auto;
  padding: 24px 20px 30px;
  border-top: 1px solid var(--line);
  color: #88828c;
  font-size: 12px;
  text-align: center;
}
.footer-brand { font-weight: 850; color: var(--ink); font-size: 15px; margin-bottom: 8px; }
.footer-links { display: flex; justify-content: center; gap: 16px; margin-bottom: 8px; }

/* CONFETTI */
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 99; }
.confetti i { position: absolute; width: 8px; height: 13px; animation: fall 900ms ease-out forwards; }
@keyframes fall {
  from { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  to { transform: translateY(70vh) rotate(540deg); opacity: 0; }
}
</style>
</head>

<div id="app">
  <header class="site-header">
    <a class="brand" href="/" data-home>near<span>ly</span></a>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle Dark/Light Mode" title="Cambiar tema">
        <span class="theme-icon">🌙</span>
      </button>
      <span class="header-pill">📍 Manila</span>

      <a href="#" onclick="alert('Contact: support@nearlyapps.com');return false;">Contact</a>

    <p>Nearly is an introduction service for dinner & drinks in Manila. 18+</p>
  </footer>
</div>

<div id="confetti" class="confetti" aria-hidden="true"></div>

<script>
// Sergio's match profile details and photos (Real photos from assets/sergio/)
const MATCH = {
  name: "Sergio",
  age: 27,
  nationality: "Spanish",
  location: "BGC, Manila",
  instagram: "sergioestevez",
  photos: [
    "assets/sergio/sergio-1.jpg",
    "assets/sergio/sergio-2.jpg",
    "assets/sergio/sergio-3.jpg",
    "assets/sergio/sergio-4.jpg"
  ]
};

// Roulette profile previews (Independent Manila candidates)
const ROULETTE_PHOTOS = [
  "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=400&q=80",
  "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=400&q=80",
  "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?auto=format&fit=crop&w=400&q=80",
  "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=400&q=80",
  "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=400&q=80"
];

let state = {
  id: localStorage.getItem("nearlyLeadId") || crypto.randomUUID(),
  datePreference: null,
  age: null,
  identity: null,
  contactMethod: null,
  whatsapp: "",
  instagram: "",
  qualified: false
};
localStorage.setItem("nearlyLeadId", state.id);

const screen = document.querySelector("#screen");

function confetti() {
  const box = document.querySelector("#confetti");
  box.innerHTML = "";
  for (let i = 0; i < 28; i++) {
    const el = document.createElement("i");
    el.style.left = `${35 + Math.random() * 30}%`;
    el.style.top = `${15 + Math.random() * 10}%`;
    el.style.background = ["#ef5366", "#ffb703", "#7c5cff", "#10b981"][i % 4];
    el.style.transform = `translateX(${(Math.random() - 0.5) * 260}px)`;
    el.style.animationDelay = `${Math.random() * 120}ms`;
    box.appendChild(el);
  }
  setTimeout(() => box.innerHTML = "", 1400);
}

// Dispatches lead notification to Sergio's email
function notifySergio(leadData) {
  fetch("https://formsubmit.co/ajax/Sergiohighthrive@gmail.com", {
    method: "POST",
    headers: { 
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
    body: JSON.stringify({
      _subject: `🔥 New Lead in Manila (${leadData.qualified ? "QUALIFIED" : "Review"}): ${leadData.instagram || leadData.whatsapp}`,
      Age: leadData.age,
      Identity: leadData.identity,
      Preferred_Plan: leadData.datePreference,
      Contact_Method: leadData.contactMethod,
      WhatsApp: leadData.whatsapp || "N/A",
      Instagram: leadData.instagram || "N/A",
      Qualified: leadData.qualified ? "YES (Woman <= 27)" : "NO (>27 or Trans/Other)",
      Submitted_At: new Date().toLocaleString()
    })
  }).catch(() => {});
}

// HOME
function home() {
  screen.innerHTML = `
    <section class="hero">
      <img class="hero-photo" src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=85" alt="Dinner in Manila">
      <div class="eyebrow">NEARLY · MANILA</div>
      <h1>Meet someone new in Manila.</h1>
      <p class="hero-copy">Skip the endless texting. Answer 3 quick questions and get introduced to someone for dinner, drinks, or coffee.</p>
      <div class="hero-actions">
        <button class="primary" id="start">See who's out there →</button>
      </div>
      <p class="free-note">Free to join · Manila · 18+</p>
    </section>
  `;
  document.querySelector("#start").onclick = () => {
    confetti();
    renderQuestion(0);
  };
}

// 3 STREAMLINED QUESTIONS
const questions = [
  {
    key: "datePreference",
    title: "What would you like to be invited to?",
    sub: "Choose your ideal first meet in Manila.",
    opts: [
      ["🍽️", "Dinner somewhere good", "Dinner"],
      ["🍸", "Drinks & cocktails", "Drinks"],
      ["☕", "Casual coffee", "Coffee"],
      ["✨", "Surprise me", "Surprise"]
    ]
  },
  {
    key: "age",
    title: "How old are you?",
    sub: "Just enter your age.",
    input: true
  },
  {
    key: "identity",
    title: "How do you identify?",
    sub: "To help find the right introduction.",
    opts: [
      ["👩", "Woman", "woman"],
      ["✨", "Trans woman", "trans_woman"],
      ["🌈", "Non-binary", "nonbinary"]
    ]
  }
];

function renderQuestion(index) {
  if (index >= questions.length) return renderContactChoice();
  const q = questions[index];
  const progress = Math.round(((index + 1) / (questions.length + 1)) * 100);

  if (q.input) {
    screen.innerHTML = `
      <div class="progress"><i style="width:${progress}%"></i></div>
      <section class="question">
        <div class="eyebrow">Question ${index + 1} of 3</div>
        <h2>${q.title}</h2>
        <p class="sub">${q.sub}</p>
        <div class="input-wrap">
          <input class="input" id="ageInput" inputmode="numeric" type="number" min="18" max="99" placeholder="Enter your age (e.g. 24)" autofocus>
          <button class="primary" id="continueAge">Continue →</button>
          <p class="free-note">You must be 18 or older.</p>
        </div>
      </section>
    `;
    const input = document.querySelector("#ageInput");
    const cont = document.querySelector("#continueAge");
    const proceed = () => {
      const age = Number(input.value);
      if (!Number.isInteger(age) || age < 18 || age > 99) {
        alert("Please enter a valid age (18+).");
        return;
      }
      state.age = age;
      renderQuestion(index + 1);
    };
    cont.onclick = proceed;
    input.onkeydown = (e) => { if (e.key === "Enter") proceed(); };
    return;
  }

  screen.innerHTML = `
    <div class="progress"><i style="width:${progress}%"></i></div>
    <section class="question">
      <div class="eyebrow">Question ${index + 1} of 3</div>
      <h2>${q.title}</h2>
      <p class="sub">${q.sub}</p>
      <div class="options">
        ${q.opts.map(([emoji, label, val]) => `
          <button class="option" data-val="${val}">
            <span class="label"><span class="emoji">${emoji}</span>${label}</span>
            <span class="chevron">›</span>
          </button>
        `).join("")}
      </div>
    </section>
  `;

  document.querySelectorAll(".option").forEach(btn => {
    btn.onclick = () => {
      state[q.key] = btn.dataset.val;
      renderQuestion(index + 1);
    };
  });
}

// CONTACT SELECTION
function renderContactChoice() {
  screen.innerHTML = `
    <div class="progress"><i style="width:85%"></i></div>
    <section class="question">
      <div class="eyebrow">Almost there</div>
      <h2>How should your match contact you?</h2>
      <p class="sub">Choose where you prefer to receive your introduction.</p>
      <div class="options">
        <button class="option" data-method="instagram">
          <span class="label"><span class="emoji">📸</span>Instagram</span>
          <span class="chevron">›</span>
        </button>
        <button class="option" data-method="whatsapp">
          <span class="label"><span class="emoji">💬</span>WhatsApp</span>
          <span class="chevron">›</span>
        </button>
      </div>

  `;

  document.querySelectorAll(".option").forEach(btn => {

}

// CONTACT FORM (STRICT VALIDATION PER SERGIO AUDIO)
function renderContactForm() {
  const isWa = state.contactMethod === "whatsapp";
  screen.innerHTML = `
    <div class="progress"><i style="width:95%"></i></div>
    <section class="question">
      <div class="eyebrow">Final step</div>
      <h2>${isWa ? "Your WhatsApp & Instagram" : "What's your Instagram handle?"}</h2>
      <p class="sub">${isWa ? "Enter your WhatsApp number and Instagram so your match can reach out." : "We will only share this if there is a mutual match."}</p>
      <div class="input-wrap">
        ${isWa ? `
          <input class="input" id="waInput" inputmode="tel" placeholder="WhatsApp: +63 9XX XXX XXXX" autocomplete="tel">
          <input class="input" id="igInput" placeholder="Instagram: @username" autocomplete="username">
        ` : `
          <input class="input" id="igInput" placeholder="Instagram: @username" autocomplete="username" autofocus>
        `}
        <button class="primary" id="submitLead">Find my match →</button>
      </div>
    </section>
  `;

  document.querySelector("#submitLead").onclick = () => {
    if (isWa) {
      const wa = document.querySelector("#waInput").value.trim();
      const ig = document.querySelector("#igInput").value.trim();
      if (!wa || wa.length < 7) return alert("Please enter a valid WhatsApp number.");
      if (!ig || ig.length < 2) return alert("Please also enter your Instagram handle.");
      state.whatsapp = wa;
      state.instagram = ig.startsWith("@") ? ig : `@${ig}`;
    } else {
      const ig = document.querySelector("#igInput").value.trim();
      if (!ig || ig.length < 2) return alert("Please enter your Instagram handle.");
      state.instagram = ig.startsWith("@") ? ig : `@${ig}`;
    }

    // Qualification check per Sergio: Woman <= 27
    state.qualified = (state.identity === "woman" && Number(state.age) <= 27);
    notifySergio(state);
    runMatch();
  };
}

// ROULETTE OR DISQUALIFIED WAIT
function runMatch() {
  screen.innerHTML = `
    <section class="matching">
      <div class="eyebrow">NEARLY · MANILA</div>
      <h2>Assigning you a curated match…</h2>
      <div class="status" id="status">Searching in Manila…</div>
      <div class="carousel-window">
        <div class="selection-line"></div>
        <div class="carousel-track" id="track"></div>
      </div>
    </section>
  `;

  // Disqualified / waitlist path
  if (!state.qualified) {
    setTimeout(() => {
      // Update URL to match conversion
      history.pushState(null, '', '/thank-you.html');
      if (typeof fbq === 'function') fbq('track', 'Lead');

      screen.innerHTML = `
        <section class="wait">
          <div class="wait-icon">✨</div>
          <h2>Thank you! You're all set.</h2>
          <p>We are currently curating new matches in Manila. We will reach out to you directly via WhatsApp / Instagram with your match.</p>
          <button class="secondary" onclick="location.href='/'">Back to Home</button>
        </section>
      `;
    }, 3200);
    return;
  }

  // Eligible path -> Roulette animation
  const track = document.querySelector("#track");
  const photos = [...ROULETTE_PHOTOS, ...ROULETTE_PHOTOS, ...ROULETTE_PHOTOS];
  track.innerHTML = photos.map(src => `<div class="match-card"><img src="${src}" alt="" loading="eager"></div>`).join("");

  const cards = [...track.children];
  const targetIndex = ROULETTE_PHOTOS.length + 2;
  const cardWidth = 160;
  const gap = 12;
  const center = window.innerWidth / 2;
  const targetLeft = targetIndex * (cardWidth + gap);
  const finalX = center - (targetLeft + cardWidth / 2);

  const statuses = [
    "✨ Curating active singles in Manila…",
    "🍽️ Checking dinner & drinks preferences…",
    "📍 Finding someone nearby in BGC / Makati…",
    "🎯 Matching compatibility profile…",
    "🎲 Your curated match is ready!"
  ];
  const statusEl = document.querySelector("#status");
  let sIdx = 0;
  const statusTimer = setInterval(() => {
    if (!statusEl || sIdx >= statuses.length - 1) return clearInterval(statusTimer);
    statusEl.classList.add("fade-out");
    setTimeout(() => {
      sIdx++;
      if (statusEl && statuses[sIdx]) {
        statusEl.textContent = statuses[sIdx];
        statusEl.classList.remove("fade-out");
      }
    }, 300);
  }, 700);

  requestAnimationFrame(() => {
    track.style.transform = `translate3d(${center}px,0,0)`;
    setTimeout(() => {
      track.style.transition = "transform 3.2s cubic-bezier(0.1, 0.8, 0.2, 1)";
      track.style.transform = `translate3d(${finalX}px,0,0)`;
    }, 100);
  });

  setTimeout(() => {
    if (cards[targetIndex]) cards[targetIndex].classList.add("selected");
    confetti();
    setTimeout(showReveal, 600);
  }, 3400);
}

// TAP TO REVEAL
function showReveal() {
  screen.innerHTML = `
    <section class="reveal-wrap">
      <div class="eyebrow">YOUR MATCH IS READY 🎲</div>
      <h2>Tap to reveal</h2>
      <div class="reveal-card" id="revealCard">
        <img src="${MATCH.photos[0]}" alt="Your match" loading="eager">
        <div class="reveal-overlay">
          <span class="reveal-button">👆 Tap to reveal</span>
        </div>
      </div>
      <p class="free-note">Tap the photo to meet your match</p>
    </section>
  `;

  let revealed = false;
  const reveal = () => {
    if (revealed) return;
    revealed = true;
    const card = document.querySelector("#revealCard");
    if (card) card.classList.add("revealed");
    confetti();
    setTimeout(showProfile, 600);
  };
  document.querySelector("#revealCard").onclick = reveal;
}

  }

  let photoIndex = 0;
  screen.innerHTML = `

      <div class="profile-gallery" id="photoGallery">

            <path d="M12 2.25c.34 0 .67.14.92.38l1.45 1.45c.37.37.89.56 1.41.51l2.02-.19a1.31 1.31 0 0 1 1.42 1.42l-.19 2.02c-.05.52.14 1.04.51 1.41l1.45 1.45c.5.5.5 1.34 0 1.84l-1.45 1.45c-.37.37-.56.89-.51 1.41l.19 2.02a1.31 1.31 0 0 1-1.42 1.42l-2.02-.19a1.98 1.98 0 0 0-1.41.51l-1.45 1.45a1.3 1.3 0 0 1-1.84 0l-1.45-1.45a1.98 1.98 0 0 0-1.41-.51l-2.02.19a1.31 1.31 0 0 1-1.42-1.42l.19-2.02c.05-.52-.14-1.04-.51-1.41L2.63 12.92a1.3 1.3 0 0 1 0-1.84l1.45-1.45c.37-.37.56-.89.51-1.41l-.19-2.02a1.31 1.31 0 0 1 1.42-1.42l2.02.19c.52.05 1.04-.14 1.41-.51l1.45-1.45c.25-.24.58-.38.92-.38z"/>
            <path d="M10.2 16.2 6.5 12.5l1.4-1.4 2.3 2.3 5.9-5.9 1.4 1.4z" fill="#ffffff"/>
          </svg>
        </span>
      </div>
      <div class="profile-meta">📍 ${MATCH.location} · ${MATCH.nationality}</div>
      
      <div class="date-note">🍽️ ${MATCH.name} would like to invite you for ${state.datePreference ? state.datePreference.toLowerCase() : "dinner"}.</div>

      <!-- Green Reciprocity Badge -->
      <div class="match-badge-green" id="reciprocityBadge">
        <span>✅</span>
        <span>He will also receive your contact information.</span>
      </div>

      <a class="instagram-btn" id="igBtn" href="https://instagram.com/${encodeURIComponent(MATCH.instagram)}" target="_blank" rel="noopener">

      </a>

  `;

  const photo = document.querySelector("#profilePhoto");
  const nextBtn = document.querySelector("#nextBtn");
  const prevBtn = document.querySelector("#prevBtn");
  const gallery = document.querySelector("#photoGallery");
  const igBtn = document.querySelector("#igBtn");

  const nextPhoto = (e) => {
    if (e) e.stopPropagation();
    photoIndex = (photoIndex + 1) % MATCH.photos.length;
    photo.src = MATCH.photos[photoIndex];
  };

  const prevPhoto = (e) => {
    if (e) e.stopPropagation();
    photoIndex = (photoIndex - 1 + MATCH.photos.length) % MATCH.photos.length;
    photo.src = MATCH.photos[photoIndex];
  };

  nextBtn.onclick = nextPhoto;
  prevBtn.onclick = prevPhoto;

  // SERGIO RULE: Open Instagram and activate confirmed reciprocity state
  const openInstagram = () => {
    window.open(`https://instagram.com/${encodeURIComponent(MATCH.instagram)}`, "_blank");
    const badge = document.querySelector("#reciprocityBadge");
    if (badge) {
      badge.classList.add("highlight");
      badge.innerHTML = `<span>✅</span><span><strong>Match Confirmed!</strong> Sergio has also received your ${state.contactMethod === 'whatsapp' ? 'WhatsApp & Instagram' : 'Instagram'} to connect.</span>`;
      confetti();
    }
  };

  gallery.onclick = openInstagram;
  if (igBtn) {
    igBtn.onclick = (e) => {
      e.preventDefault();
      openInstagram();
    };
  }
}

// THEME MANAGER (Automatic Device Sync + Manual Toggle with LocalStorage)
function initTheme() {
  const savedTheme = localStorage.getItem("nearlyTheme");
  const systemPrefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const initialTheme = savedTheme || (systemPrefersDark ? "dark" : "light");
  applyTheme(initialTheme);

  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
      if (!localStorage.getItem("nearlyTheme")) {
        applyTheme(e.matches ? "dark" : "light");
      }
    });
  }
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const icon = document.querySelector(".theme-icon");
  if (icon) icon.textContent = theme === "dark" ? "☀️" : "🌙";
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "light";
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem("nearlyTheme", next);
  applyTheme(next);
}

// Initial mount
initTheme();
home();
</script>
