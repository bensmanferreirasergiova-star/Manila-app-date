<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Nearly — Curated Introductions in Manila</title>
<meta name="description" content="Three quick questions. One curated introduction for dinner, drinks, or coffee in Manila.">

<!-- Open Graph / Social Media Preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="Nearly — Curated Introductions in Manila">
<meta property="og:description" content="Answer 3 quick questions and get a curated introduction for dinner or drinks in Manila. 100% free to join.">
<meta property="og:image" content="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=85">
<meta name="twitter:card" content="summary_large_image">

<!-- Google Fonts: Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #111113;
  --muted: #6e6a72;
  --line: #ede8ee;
  --accent: #ef5366;
  --accent-soft: #fff0f2;
  --green: #10b981;
  --green-soft: #ecfdf5;
  --green-border: #a7f3d0;
  --green-text: #065f46;
  --bg: #ffffff;
  --card-bg: #faf8fa;
  --pill-bg: #f4f0f4;
  --pill-color: #635e67;
  --date-note-bg: #fbf7fb;
  --date-note-color: #1f1b24;
  --input-bg: #ffffff;
  --input-border: #ded8df;
  --primary-bg: #111113;
  --primary-color: #ffffff;
  --secondary-bg: #f7f4f7;
  --secondary-color: #111113;
  --shadow-color: rgba(0,0,0,0.12);
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --max: 520px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none !important;
}
html, body {
  min-height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-x: none;
  -webkit-tap-highlight-color: transparent !important;
}

img, button, a, .profile-gallery, .match-card, .reveal-card, .option {
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  user-select: none !important;
  outline: none !important;
}

button, input { font: inherit; }
a { color: inherit; text-decoration: none; }

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.site-header {
  width: 100%;
  max-width: var(--max);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
}

.brand {
  font-weight: 900;
  font-size: 22px;
  letter-spacing: -0.04em;
  color: var(--ink);
}
.brand span { color: var(--accent); }

.header-pill {
  font-size: 12px;
  font-weight: 750;
  color: var(--pill-color);
  background: var(--pill-bg);
  border-radius: 999px;
  padding: 6px 12px;
}

#screen {
  width: 100%;
  max-width: var(--max);
  margin: 0 auto;
  padding: 8px 20px 40px;
  flex: 1;
}

/* HERO */
.hero { padding: 10px 0 20px; }
.hero-photo {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: 26px;
  display: block;
  box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}
.eyebrow {
  margin-top: 20px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
h1 {
  font-size: clamp(34px, 8.5vw, 44px);
  line-height: 1.05;
  letter-spacing: -0.045em;
  margin: 8px 0 14px;
}
h2 {
  font-size: 28px;
  line-height: 1.12;
  letter-spacing: -0.035em;
  margin: 10px 0 8px;
}
p.sub {
  color: var(--muted);
  font-size: 16px;
  line-height: 1.45;
  margin-bottom: 22px;
}
.hero-copy {
  font-size: 16px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 22px;
}

/* BUTTONS */
.hero-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}
.primary {
  width: 100%;
  min-height: 58px;
  border: 0;
  border-radius: 18px;
  background: var(--primary-bg);
  color: var(--primary-color);
  font-weight: 800;
  font-size: 17px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 24px var(--shadow-color);
  transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
}
.primary:active { transform: scale(0.985); opacity: 0.92; }

.secondary {
  width: 100%;
  min-height: 52px;
  border: 0;
  border-radius: 16px;
  background: var(--secondary-bg);
  color: var(--secondary-color);
  font-weight: 750;
  font-size: 15px;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}
.free-note {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin-top: 12px;
}

/* PROGRESS */
.progress {
  height: 4px;
  background: var(--line);
  border-radius: 99px;
  margin: 8px 0 24px;
  overflow: hidden;
}
.progress i {
  display: block;
  height: 100%;
  background: var(--accent);
  transition: width 0.35s ease;
}

/* QUESTIONS & OPTIONS */
.question { padding: 4px 0; }
.options { display: grid; gap: 10px; margin-top: 14px; }
.option {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px;
  background: var(--card-bg);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 18px;
  text-align: left;
  font-weight: 750;
  font-size: 16px;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.option .label { display: flex; align-items: center; }
.option .emoji { font-size: 22px; margin-right: 12px; }
.option .chevron { color: var(--muted); font-size: 20px; font-weight: 400; }
.option:hover, .option:active {
  background: var(--accent-soft);
  border-color: var(--accent);
  transform: scale(0.99);
}

.input-wrap { display: grid; gap: 14px; margin-top: 16px; }
.input {
  width: 100%;
  min-height: 58px;
  border: 1.5px solid var(--input-border);
  border-radius: 18px;
  padding: 0 18px;
  font-size: 17px;
  background: var(--input-bg);
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}

/* ROULETTE MATCHING */
.matching { text-align: center; padding: 24px 0 10px; }
.matching .status {
  min-height: 38px;
  color: var(--ink);
  font-size: 17px;
  font-weight: 750;
  margin-top: 16px;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.matching .status.fade-out {
  opacity: 0;
  transform: translateY(4px);
}
.carousel-window {
  position: relative;
  overflow: hidden;
  margin: 22px -20px 0;
  padding: 12px 0 18px;
}
.carousel-track {
  display: flex;
  gap: 12px;
  will-change: transform;
}
.match-card {
  flex: 0 0 160px;
  aspect-ratio: 4/5;
  border-radius: 22px;
  overflow: hidden;
  position: relative;
  background: #eee;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.match-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(14px);
  transform: scale(1.06);
}
.match-card.selected {
  transform: scale(1.08);
  box-shadow: 0 14px 36px rgba(239,83,102,0.3);
  outline: 3px solid var(--accent);
}
.selection-line {
  position: absolute;
  left: 50%;
  top: 4px;
  bottom: 6px;
  width: 2px;
  background: var(--accent);
  opacity: 0.85;
  transform: translateX(-50%);
  z-index: 4;
}

/* REVEAL */
.reveal-wrap { text-align: center; padding-top: 10px; }
.reveal-card {
  position: relative;
  cursor: pointer;
  border-radius: 26px;
  overflow: hidden;
  box-shadow: 0 14px 38px rgba(0,0,0,0.14);
  margin: 14px 0 18px;
}
.reveal-card img {
  width: 100%;
  aspect-ratio: 4/5;
  object-fit: cover;
  border-radius: 26px;
  filter: blur(18px);
  transform: scale(1.04);
  transition: filter 0.65s cubic-bezier(0.16,1,0.3,1), transform 0.4s ease;
  display: block;
}
.reveal-card.revealed img {
  filter: blur(0px);
  transform: scale(1);
}
.reveal-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.15);
  transition: opacity 0.4s ease;
}
.reveal-button {
  background: #ffffff;
  color: #111113 !important;
  font-weight: 850;
  font-size: 17px;
  border-radius: 999px;
  padding: 15px 28px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.35);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(255,255,255,0.8);
  letter-spacing: -0.01em;
}
.reveal-card.revealed .reveal-overlay { display: none; }

/* PROFILE VIEW */
.profile { text-align: center; padding: 4px 0 20px; }
.profile-gallery {
  position: relative;
  border-radius: 26px;
  overflow: hidden;
  box-shadow: 0 14px 36px rgba(0,0,0,0.12);
  cursor: pointer;
}
.profile-gallery img {
  width: 100%;
  aspect-ratio: 4/5;
  object-fit: cover;
  border-radius: 26px;
  display: block;
  transition: opacity 0.25s ease;
}
.gallery-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%) scale(1);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  box-shadow: 0 6px 22px rgba(0,0,0,0.18);
  color: var(--ink);
  cursor: pointer;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
.gallery-arrow svg {
  width: 24px;
  height: 24px;
  display: block;
  pointer-events: none;
  stroke: #17151a;
  transition: stroke 0.2s ease;
}
.gallery-arrow.prev { left: 14px; }
.gallery-arrow.next { right: 14px; }

/* EFECTO LUPA / ZOOM EN HOVER */
.gallery-arrow:hover {
  transform: translateY(-50%) scale(1.22);
  background: #ffffff;
  box-shadow: 0 10px 28px rgba(239,83,102,0.35);
  border-color: #ffccd3;
}
.gallery-arrow:hover svg {
  stroke: var(--accent);
}
.gallery-arrow:active {
  transform: translateY(-50%) scale(0.92);
}

.profile-name {
  font-size: 36px;
  font-weight: 850;
  letter-spacing: -0.035em;
  color: var(--ink);
  margin: 18px 0 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 8px;
}
.verified-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  filter: drop-shadow(0 2px 6px rgba(0, 149, 246, 0.45));
}
.profile-meta {
  color: #524c58;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  width: 100%;
  margin: 0 auto 16px;
  padding: 0;
  gap: 6px;
}
.date-note {
  margin: 14px 0 16px;
  font-size: 18px;
  font-weight: 750;
  color: #1f1b24;
  background: #fbf7fb;
  border: 1.5px solid var(--line);
  padding: 16px 20px;
  border-radius: 18px;
  line-height: 1.4;
}

/* GREEN RECIPROCITY BADGE */
.match-badge-green {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--green-soft);
  border: 1.5px solid var(--green-border);
  color: var(--green-text);
  font-weight: 750;
  font-size: 16px;
  padding: 16px 20px;
  border-radius: 18px;
  margin-bottom: 16px;
  line-height: 1.4;
  transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}
.match-badge-green.highlight {
  background: #d1fae5;
  box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.25);
  transform: scale(1.02);
}

.instagram-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
  color: #fff;
  font-weight: 850;
  font-size: 18px;
  padding: 18px 22px;
  border-radius: 18px;
  background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045);
  box-shadow: 0 12px 30px rgba(253,29,29,0.25);
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.instagram-btn:active { transform: scale(0.985); opacity: 0.94; }

/* WAIT / DISQUALIFIED */
.wait {
  text-align: center;
  padding: 60px 10px;
}
.wait-icon { font-size: 44px; margin-bottom: 14px; }
.wait h2 { font-size: 30px; }
.wait p { font-size: 16px; color: var(--muted); line-height: 1.55; margin: 12px 0 26px; }

/* FOOTER */
.site-footer {
  max-width: var(--max);
  width: 100%;
  margin: 0 auto;
  padding: 24px 20px 30px;
  border-top: 1px solid var(--line);
  color: #88828c;
  font-size: 12px;
  text-align: center;
}
.footer-brand { font-weight: 850; color: var(--ink); font-size: 15px; margin-bottom: 8px; }
.footer-links { display: flex; justify-content: center; gap: 16px; margin-bottom: 8px; }

/* VERIFICATION SPINNER & BADGE */
.verify-spinner {
  width: 48px;
  height: 48px;
  margin: 0 auto 20px;
  border: 4px solid var(--accent-soft);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
.verify-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--green-soft);
  border: 1px solid var(--green-border);
  color: var(--green-text);
  font-size: 13px;
  font-weight: 700;
}
.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
  animation: pulseDot 1.4s infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes pulseDot {
  0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
  70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

/* CONFETTI */
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 99; }
.confetti i { position: absolute; width: 8px; height: 13px; animation: fall 900ms ease-out forwards; }
@keyframes fall {
  from { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  to { transform: translateY(70vh) rotate(540deg); opacity: 0; }
}
</style>
</head>
<body>

<div id="app">
  <header class="site-header">
    <a class="brand" href="/" data-home>near<span>ly</span></a>
    <span class="header-pill">📍 Manila</span>
  </header>

  <main id="screen" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="footer-brand">Nearly Manila</div>
    <div class="footer-links">
      <a href="#" onclick="alert('Nearly is a curated introduction club in Manila. 18+');return false;">About</a>
      <a href="#" onclick="alert('Privacy protected. We never sell your contact.');return false;">Privacy</a>
      <a href="#" onclick="alert('Contact: support@nearlyapps.com');return false;">Contact</a>
    </div>
    <p>Nearly is an introduction service for dinner & drinks in Manila. 18+</p>
  </footer>
</div>

<div id="confetti" class="confetti" aria-hidden="true"></div>

<script>
// Sergio's match profile details and photos (Real photos from assets/sergio/)
const MATCH = {
  name: "Sergio",
  age: 27,
  nationality: "Spanish",
  location: "BGC, Manila",
  instagram: "Sergiobbsp55",
  photos: [
    "assets/sergio/sergio-1.jpg",
    "assets/sergio/sergio-2.jpg",
    "assets/sergio/sergio-3.jpg",
    "assets/sergio/sergio-4.jpg"
  ]
};

// Roulette profile previews (Exclusive Sergio photos)
const ROULETTE_PHOTOS = [
  "assets/sergio/sergio-1.jpg",
  "assets/sergio/sergio-2.jpg",
  "assets/sergio/sergio-3.jpg",
  "assets/sergio/sergio-4.jpg"
];

let state = {
  id: localStorage.getItem("nearlyLeadId") || crypto.randomUUID(),
  datePreference: null,
  age: null,
  identity: null,
  contactMethod: null,
  whatsapp: "",
  instagram: "",
  qualified: false
};
localStorage.setItem("nearlyLeadId", state.id);

const screen = document.querySelector("#screen");

function confetti() {
  const box = document.querySelector("#confetti");
  box.innerHTML = "";
  for (let i = 0; i < 28; i++) {
    const el = document.createElement("i");
    el.style.left = `${35 + Math.random() * 30}%`;
    el.style.top = `${15 + Math.random() * 10}%`;
    el.style.background = ["#ef5366", "#ffb703", "#7c5cff", "#10b981"][i % 4];
    el.style.transform = `translateX(${(Math.random() - 0.5) * 260}px)`;
    el.style.animationDelay = `${Math.random() * 120}ms`;
    box.appendChild(el);
  }
  setTimeout(() => box.innerHTML = "", 1400);
}

// Dispatches lead notification to Sergio's email via secure token (ONLY QUALIFIED LEADS)
function notifySergio(leadData) {
  // Silent private backup storage (Always stores all leads)
  saveLeadToBackup(leadData);

  // Only dispatch email to Sergio if the lead is 100% QUALIFIED (Woman <= 27)
  if (leadData.qualified) {
    fetch("https://formsubmit.co/ajax/b4b8ac278896555c59dd27987df9f7e0", {
      method: "POST",
      headers: { 
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({
        _subject: `🔥 New Match in Manila (QUALIFIED): ${leadData.instagram || leadData.whatsapp}`,
        Age: leadData.age,
        Identity: leadData.identity,
        Preferred_Plan: leadData.datePreference,
        Contact_Method: leadData.contactMethod,
        WhatsApp: leadData.whatsapp || "N/A",
        Instagram: leadData.instagram || "N/A",
        Qualified: "YES (Woman <= 27)",
        Submitted_At: new Date().toLocaleString()
      })
    }).catch(() => {});
  }
}

// HOME
function home() {
  screen.innerHTML = `
    <section class="hero">
      <img class="hero-photo" src="assets/home-hero.jpg" alt="Meet someone special">
      <div class="eyebrow">NEARLY · MANILA</div>
      <h1>Meet someone new in Manila.</h1>
      <p class="hero-copy">Skip the endless texting. Answer 3 quick questions and get introduced to someone for dinner, drinks, or coffee.</p>
      <div class="hero-actions">
        <button class="primary" id="start">See who's out there →</button>
      </div>
      <p class="free-note">Free to join · Manila · 18+</p>
    </section>
  `;
  document.querySelector("#start").onclick = () => {
    confetti();
    renderQuestion(0);
  };
}

// 3 STREAMLINED QUESTIONS
const questions = [
  {
    key: "datePreference",
    title: "What would you like to be invited to?",
    sub: "Choose your ideal first meet in Manila.",
    opts: [
      ["🍽️", "Dinner somewhere good", "Dinner"],
      ["🍸", "Drinks & cocktails", "Drinks"],
      ["☕", "Casual coffee", "Coffee"],
      ["✨", "Surprise me", "Surprise"]
    ]
  },
  {
    key: "age",
    title: "How old are you?",
    sub: "Just enter your age.",
    input: true
  },
  {
    key: "identity",
    title: "How do you identify?",
    sub: "To help find the right introduction.",
    opts: [
      ["👩", "Woman", "woman"],
      ["✨", "Trans woman", "trans_woman"],
      ["🌈", "Non-binary", "nonbinary"]
    ]
  }
];

function renderQuestion(index) {
  if (index >= questions.length) return renderContactChoice();
  const q = questions[index];
  const progress = Math.round(((index + 1) / (questions.length + 1)) * 100);

  if (q.input) {
    screen.innerHTML = `
      <div class="progress"><i style="width:${progress}%"></i></div>
      <section class="question">
        <div class="eyebrow">Question ${index + 1} of 3</div>
        <h2>${q.title}</h2>
        <p class="sub">${q.sub}</p>
        <div class="input-wrap">
          <input class="input" id="ageInput" inputmode="numeric" type="number" min="18" max="99" placeholder="Enter your age (e.g. 24)" autofocus>
          <button class="primary" id="continueAge">Continue →</button>
          <p class="free-note">You must be 18 or older.</p>
        </div>
      </section>
    `;
    const input = document.querySelector("#ageInput");
    const cont = document.querySelector("#continueAge");

// REAL INSTAGRAM VALIDATION & VERIFICATION ENGINE
function validateInstagramHandle(raw) {
  let handle = (raw || "").trim().replace(/^@+/, "");
  
  if (!handle || handle.length < 3) {
    return { valid: false, error: "Please enter your Instagram username (minimum 3 characters)." };
  }
  if (handle.length > 30) {
    return { valid: false, error: "Instagram usernames cannot exceed 30 characters." };
  }
  if (!/^[a-zA-Z0-9._]+$/.test(handle)) {
    return { valid: false, error: "Instagram usernames can only contain letters, numbers, periods (.), and underscores (_)." };
  }
  if (handle.startsWith(".") || handle.endsWith(".")) {
    return { valid: false, error: "Instagram usernames cannot start or end with a period." };
  }
  if (handle.includes("..")) {
    return { valid: false, error: "Instagram usernames cannot contain consecutive periods (..)." };
  }

  const lower = handle.toLowerCase();
  const fakeWords = [
    "test", "testing", "fake", "none", "null", "noig", "no_instagram",
    "noinstagram", "dont_have", "donthave", "idk", "sample", "unknown",
    "asdf", "qwer", "zxcv", "123456", "12345678", "aaaa", "bbbb",
    "privado", "anonymous", "nothing", "user", "username", "someone", "n/a"
  ];
  
  for (const fake of fakeWords) {
    if (lower === fake || (fake.length >= 4 && lower.includes(fake) && lower.length < 9)) {
      return { valid: false, error: `"${handle}" looks like a placeholder. Please enter your real, active Instagram profile.` };
    }
  }

  if (/^(.)\1{3,}$/.test(lower)) {
    return { valid: false, error: "Please enter a valid, active Instagram handle." };
  }

  const mashes = ["asdfgh", "zxcvbn", "qwerty", "hjklmn"];
  for (const m of mashes) {
    if (lower.includes(m)) {
      return { valid: false, error: "Please enter a real Instagram username." };
    }
  }

  return { valid: true, handle: `@${handle}`, clean: handle };
}

        `"${l.instagram}"`,
        `"${l.whatsapp}"`,
        `"${l.age}"`,
        `"${l.identity}"`,
        `"${l.datePreference}"`,
        `"${l.qualified}"`
      ]);
      const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Nearly_Manila_Cloud_Leads_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };
  }
}

// Secret triggers: 1) URL hash #admin or 2) 5 rapid clicks on logo
if (window.location.hash === "#admin") {

}
window.addEventListener("hashchange", () => {

if (brandLogo) {

    if (logoClicks >= 5) {
      e.preventDefault();
      logoClicks = 0;
      openSecretAdminVault();
    }
  });
}

home();
